# Domain: euvion.com.ng. Verify certificate paths, root and PHP socket before installing.
# Keep the existing legacy school on its separately configured host/database.
# Install nginx-institution.conf.example separately for each approved school-owned hostname.
server {
    listen 80;
    server_name euvion.com.ng *.euvion.com.ng;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name www.euvion.com.ng;
    ssl_certificate /etc/letsencrypt/live/euvion.com.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/euvion.com.ng/privkey.pem;
    return 301 https://euvion.com.ng$request_uri;
}
server {
    listen 443 ssl;
    server_name euvion.com.ng *.euvion.com.ng;
    ssl_certificate /etc/letsencrypt/live/euvion.com.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/euvion.com.ng/privkey.pem;
    root /srv/euvion/current/public;
    index index.php;
    client_max_body_size 64m;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    # School files are served through authenticated application routes only.
    location ^~ /storage/ { deny all; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }
    location ~ /\.(?!well-known).* { deny all; }
}
